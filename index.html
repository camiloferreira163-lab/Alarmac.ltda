<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alarmac - Sistema de Gestión</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root {
    --azul-rey: #1e3a8a;
    --amarillo: #fbbf24;
    --blanco: #ffffff;
    --gris-claro: #f3f4f6;
    --gris-borde: #e5e7eb;
    --verde: #16a34a;
    --naranja: #ea580c;
    --gris-texto: #555;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--gris-claro);
    min-height: 100vh;
  }

  /* ===== PANTALLA DE LOGIN ===== */
  .caja-login {
    background: var(--blanco);
    padding: 30px 25px;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    width: 100%;
    max-width: 380px;
    text-align: center;
    margin: 60px auto;
  }

  .caja-login h1 { color: var(--azul-rey); margin-bottom: 5px; }
  .caja-login p { color: var(--gris-texto); margin-top: 0; margin-bottom: 25px; }

  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
  }

  button {
    padding: 13px 20px;
    background: var(--azul-rey);
    color: var(--blanco);
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }

  button.ancho { width: 100%; }
  button:hover { opacity: 0.9; }
  button.secundario { background: var(--amarillo); color: var(--azul-rey); }
  button.pequeno { padding: 8px 14px; font-size: 13px; }

  #mensaje-error { color: #dc2626; margin-top: 10px; font-size: 14px; }
  #mensaje-info { color: var(--verde); margin-top: 10px; font-size: 14px; }

  .campo-clave-contenedor {
    position: relative;
  }

  .campo-clave-contenedor input { padding-right: 44px; }

  .boton-ojo {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
    font-size: 18px;
    color: var(--gris-texto);
  }

  .link-olvide {
    background: none;
    color: var(--azul-rey);
    font-size: 13px;
    text-decoration: underline;
    padding: 4px;
    margin-top: -8px;
    margin-bottom: 10px;
  }

  /* ===== ENCABEZADO DE LA APP (después de iniciar sesión) ===== */
  .encabezado {
    background: var(--azul-rey);
    color: var(--blanco);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .encabezado h2 { margin: 0; font-size: 18px; }
  .encabezado span { font-size: 13px; opacity: 0.85; }

  .contenedor {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  .tarjeta {
    background: var(--blanco);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  .tarjeta h3 {
    margin: 0 0 6px 0;
    color: var(--azul-rey);
    font-size: 16px;
  }

  .tarjeta p { margin: 3px 0; font-size: 14px; color: var(--gris-texto); }

  .etiqueta-estado {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    color: white;
    margin-top: 6px;
  }

  .estado-pendiente { background: var(--naranja); }
  .estado-en_camino { background: #2563eb; }
  .estado-en_progreso { background: #7c3aed; }
  .estado-terminado { background: var(--verde); }

  .titulo-seccion {
    color: var(--azul-rey);
    border-bottom: 2px solid var(--amarillo);
    padding-bottom: 6px;
    margin-top: 30px;
  }

  .oculto { display: none; }

  #cargando { text-align: center; padding: 40px; color: var(--gris-texto); }

  .boton-nuevo {
    background: var(--verde);
    margin-bottom: 12px;
  }

  .formulario {
    background: var(--blanco);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    border: 2px solid var(--amarillo);
  }

  .formulario label {
    display: block;
    font-size: 13px;
    color: var(--gris-texto);
    margin-top: 8px;
    margin-bottom: 3px;
  }

  .formulario select {
    width: 100%;
    padding: 12px;
    margin-bottom: 5px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
  }

  .fila-botones {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }

  .fila-botones button { flex: 1; }
  .boton-cancelar { background: #9ca3af; }

  .selector-estado {
    width: auto;
    padding: 6px 10px;
    margin-top: 8px;
    margin-bottom: 0;
    font-size: 13px;
    display: inline-block;
  }

  #mensaje-form { font-size: 13px; margin-top: 8px; }

  #buscador-clientes {
    margin-bottom: 14px;
  }

  #buscador-servicios, #th-mes, #th-buscador {
    margin-bottom: 14px;
  }

  .boton-eliminar {
    background: #dc2626;
    padding: 6px 12px;
    font-size: 12px;
    margin-top: 8px;
    margin-right: 8px;
  }

  .tarjeta-botones {
    display: flex;
    gap: 8px;
  }

  .tarjeta-clicable {
    cursor: pointer;
  }

  .tarjeta-clicable:active {
    background: var(--gris-claro);
  }

  /* ===== VENTANA EMERGENTE (MODAL) ===== */
  .fondo-modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }

  .caja-modal {
    background: var(--blanco);
    border-radius: 16px 16px 0 0;
    padding: 20px;
    width: 100%;
    max-width: 500px;
    max-height: 85vh;
    overflow-y: auto;
  }

  .caja-modal h2 {
    color: var(--azul-rey);
    margin-top: 0;
    margin-bottom: 4px;
  }

  .caja-modal p {
    font-size: 15px;
    color: var(--gris-texto);
    margin: 6px 0;
  }

  .caja-modal p strong {
    color: #222;
  }

  .boton-cerrar-modal {
    background: #9ca3af;
    width: 100%;
    margin-top: 16px;
  }

  .vista-previa-foto {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 8px;
    margin-top: 8px;
  }

  textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    font-family: Arial, sans-serif;
    min-height: 80px;
  }

  .item-historial {
    border-left: 3px solid var(--amarillo);
    padding: 8px 0 8px 10px;
    margin-bottom: 10px;
  }

  .item-historial p { margin: 2px 0; font-size: 13px; }
  .item-historial .fecha-historial { font-weight: bold; color: var(--azul-rey); }
</style>
</head>
<body>

  <!-- ===== PANTALLA DE LOGIN ===== -->
  <div class="caja-login" id="pantalla-login">
    <h1>Alarmac</h1>
    <p>Sistema de gestión técnica</p>
    <input type="email" id="campo-correo" placeholder="Correo electrónico">

    <div class="campo-clave-contenedor">
      <input type="password" id="campo-clave" placeholder="Contraseña">
      <button type="button" class="boton-ojo" onclick="alternarClave()">👁️</button>
    </div>

    <button type="button" class="link-olvide" onclick="olvideClave()">¿Olvidaste tu contraseña?</button>

    <button class="ancho" onclick="iniciarSesion()">Iniciar sesión</button>
    <p id="mensaje-error"></p>
    <p id="mensaje-info"></p>
  </div>

  <div id="cargando" class="oculto">Cargando información...</div>

  <!-- ===== APP PRINCIPAL (después de iniciar sesión) ===== -->
  <div id="app-principal" class="oculto">
    <div class="encabezado">
      <div>
        <h2 id="titulo-panel">Alarmac</h2>
        <span id="texto-usuario"></span>
      </div>
      <button class="secundario pequeno" onclick="cerrarSesion()">Salir</button>
    </div>

    <div class="contenedor">

      <!-- Panel de administrador -->
      <div id="panel-admin" class="oculto">
        <h3 class="titulo-seccion">Clientes</h3>
        <button class="boton-nuevo" onclick="mostrarFormularioCliente()">+ Nuevo cliente</button>

        <div class="formulario oculto" id="form-cliente">
          <h3 id="titulo-form-cliente" style="margin-top:0; color: var(--azul-rey);">Nuevo cliente</h3>
          <label>Nombre del cliente / negocio</label>
          <input type="text" id="fc-nombre">
          <label>Empresa</label>
          <input type="text" id="fc-empresa">
          <label>Dirección</label>
          <input type="text" id="fc-direccion">
          <label>Barrio</label>
          <input type="text" id="fc-barrio">
          <label>Ciudad</label>
          <input type="text" id="fc-ciudad">
          <label>Teléfono</label>
          <input type="text" id="fc-telefono">
          <label>Celular</label>
          <input type="text" id="fc-celular">
          <label>Correo</label>
          <input type="email" id="fc-correo">
          <label>Fecha de ingreso</label>
          <input type="date" id="fc-fecha">
          <label>Equipos que utiliza (ej: 4 cámaras, 1 panel de alarma)</label>
          <input type="text" id="fc-equipos">
          <label>Observaciones</label>
          <input type="text" id="fc-observaciones">
          <div class="fila-botones">
            <button class="boton-cancelar" onclick="ocultarFormularioCliente()">Cancelar</button>
            <button onclick="guardarCliente()">Guardar cliente</button>
          </div>
          <p id="mensaje-form"></p>
        </div>

        <input type="text" id="buscador-clientes" placeholder="🔎 Buscar cliente por nombre, empresa o barrio..." oninput="filtrarClientes()">

        <div id="lista-clientes"></div>

        <h3 class="titulo-seccion">Técnicos</h3>
        <button class="boton-nuevo" onclick="mostrarFormularioTecnico()">+ Nuevo técnico</button>

        <div class="formulario oculto" id="form-tecnico">
          <label>Nombre completo</label>
          <input type="text" id="ft-nombre">
          <label>Correo electrónico (con el que va a iniciar sesión)</label>
          <input type="email" id="ft-correo">
          <label>Contraseña temporal (el técnico puede cambiarla después)</label>
          <input type="text" id="ft-clave">
          <div class="fila-botones">
            <button class="boton-cancelar" onclick="ocultarFormularioTecnico()">Cancelar</button>
            <button onclick="guardarTecnico()">Crear técnico</button>
          </div>
          <p id="mensaje-form-tecnico"></p>
        </div>

        <div id="lista-tecnicos"></div>

        <h3 class="titulo-seccion">Servicios</h3>
        <button class="boton-nuevo" onclick="mostrarFormularioServicio()">+ Nuevo servicio</button>

        <div class="formulario oculto" id="form-servicio">
          <label>Cliente</label>
          <select id="fs-cliente"></select>
          <label>Técnico asignado</label>
          <select id="fs-tecnico"></select>
          <label>Tipo de servicio</label>
          <select id="fs-tipo">
            <option value="instalación">Instalación</option>
            <option value="mantenimiento">Mantenimiento</option>
            <option value="reparación">Reparación</option>
          </select>
          <label>Observaciones</label>
          <input type="text" id="fs-observaciones">
          <div class="fila-botones">
            <button class="boton-cancelar" onclick="ocultarFormularioServicio()">Cancelar</button>
            <button onclick="guardarServicio()">Guardar servicio</button>
          </div>
          <p id="mensaje-form-servicio"></p>
        </div>

        <input type="text" id="buscador-servicios" list="lista-nombres-clientes" placeholder="🔎 Buscar servicios por nombre de cliente..." oninput="filtrarServiciosAdmin()">
        <datalist id="lista-nombres-clientes"></datalist>

        <div id="lista-servicios-admin"></div>
      </div>

      <!-- Panel de técnico -->
      <div id="panel-tecnico" class="oculto">
        <h3 class="titulo-seccion">Mis servicios pendientes</h3>
        <div id="lista-servicios-tecnico"></div>

        <h3 class="titulo-seccion">Historial de clientes atendidos</h3>
        <label style="font-size:13px; color:#555; display:block; margin-top:8px;">Filtrar por mes</label>
        <input type="month" id="th-mes" oninput="filtrarHistorialTecnico()">
        <input type="text" id="th-buscador" placeholder="🔎 Buscar por nombre de cliente..." oninput="filtrarHistorialTecnico()">
        <div id="lista-historial-tecnico"></div>
      </div>

    </div>
  </div>

  <!-- Aquí se dibuja la ventana emergente con el detalle del cliente -->
  <div id="modal-cliente"></div>

  <!-- Aquí se dibuja la ventana emergente donde el técnico escribe observaciones y adjunta foto -->
  <div id="modal-informe"></div>

<script>
  // ===== CONFIGURACIÓN DE FIREBASE =====
  const firebaseConfig = {
    apiKey: "AIzaSyBEYR4xdSMCCzrHDCAvNG00VKAuBOMDwG0",
    authDomain: "alarmac-834d2.firebaseapp.com",
    projectId: "alarmac-834d2",
    storageBucket: "alarmac-834d2.firebasestorage.app",
    messagingSenderId: "170123480246",
    appId: "1:170123480246:web:6d5373b7da2b9baf202a17"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // Una segunda "conexión" a Firebase, usada SOLO para crear técnicos.
  // Esto evita que, al crear un usuario nuevo, se cierre tu sesión de administrador
  // (Firebase por defecto inicia sesión automáticamente con el usuario recién creado).
  const appSecundaria = firebase.initializeApp(firebaseConfig, "Secundaria");
  const authSecundaria = appSecundaria.auth();

  // Guardamos aquí la lista de clientes ya cargada, para poder filtrarla sin
  // volver a preguntarle a Firestore cada vez que alguien escribe en el buscador
  let clientesCache = [];

  // Guarda el ID del cliente que se está editando (null si es un cliente nuevo)
  let clienteEnEdicion = null;

  // Caché de servicios del panel admin (para el buscador) y del historial del técnico
  let serviciosAdminCache = [];
  let historialTecnicoCache = [];

  // Nombres "bonitos" para mostrar los estados
  const nombresEstado = {
    pendiente: "Pendiente",
    en_camino: "En camino",
    en_progreso: "En progreso",
    terminado: "Terminado"
  };

  // ===== LOGIN =====
  function iniciarSesion() {
    const correo = document.getElementById('campo-correo').value;
    const clave = document.getElementById('campo-clave').value;
    const mensajeError = document.getElementById('mensaje-error');
    mensajeError.textContent = "";

    auth.signInWithEmailAndPassword(correo, clave)
      .catch(() => {
        mensajeError.textContent = "Error: correo o contraseña incorrectos.";
      });
  }

  function cerrarSesion() {
    auth.signOut();
  }

  // Muestra u oculta la contraseña escrita (el "ojito")
  function alternarClave() {
    const campo = document.getElementById('campo-clave');
    campo.type = campo.type === 'password' ? 'text' : 'password';
  }

  // Envía un correo para restablecer la contraseña
  function olvideClave() {
    const correo = document.getElementById('campo-correo').value;
    const mensajeError = document.getElementById('mensaje-error');
    const mensajeInfo = document.getElementById('mensaje-info');
    mensajeError.textContent = "";
    mensajeInfo.textContent = "";

    if (!correo) {
      mensajeError.textContent = "Primero escribe tu correo arriba, y luego toca este enlace.";
      return;
    }

    auth.sendPasswordResetEmail(correo)
      .then(() => {
        mensajeInfo.textContent = "Te enviamos un correo con instrucciones para restablecer tu contraseña.";
      })
      .catch(() => {
        mensajeError.textContent = "No pudimos enviar el correo. Verifica que esté bien escrito.";
      });
  }

  // ===== DETECTAR CUANDO ALGUIEN INICIA O CIERRA SESIÓN =====
  auth.onAuthStateChanged(async (usuario) => {
    if (usuario) {
      // Hay sesión iniciada: ocultamos login y mostramos "cargando"
      document.getElementById('pantalla-login').classList.add('oculto');
      document.getElementById('cargando').classList.remove('oculto');

      // Buscamos la info de este usuario en Firestore (colección "usuarios")
      const doc = await db.collection('usuarios').doc(usuario.uid).get();

      document.getElementById('cargando').classList.add('oculto');
      document.getElementById('app-principal').classList.remove('oculto');

      if (doc.exists) {
        const datos = doc.data();
        document.getElementById('texto-usuario').textContent =
          datos.nombre + ' (' + datos.rol + ')';

        if (datos.rol === 'administrador') {
          document.getElementById('titulo-panel').textContent = 'Panel de Administrador';
          document.getElementById('panel-admin').classList.remove('oculto');
          cargarClientes();
          cargarTecnicos();
          cargarServiciosAdmin();
        } else {
          document.getElementById('titulo-panel').textContent = 'Mis Trabajos';
          document.getElementById('panel-tecnico').classList.remove('oculto');
          cargarServiciosTecnico(usuario.uid);
          cargarHistorialTecnico(usuario.uid);
        }
      } else {
        document.getElementById('texto-usuario').textContent =
          'Usuario sin perfil configurado (' + usuario.email + ')';
      }

    } else {
      // No hay sesión: mostramos el login
      document.getElementById('app-principal').classList.add('oculto');
      document.getElementById('cargando').classList.add('oculto');
      document.getElementById('pantalla-login').classList.remove('oculto');
    }
  });

  // ===== FORMULARIO: NUEVO CLIENTE (o EDITAR, si se pasa un id) =====
  function mostrarFormularioCliente() {
    clienteEnEdicion = null;
    document.getElementById('titulo-form-cliente').textContent = 'Nuevo cliente';
    document.getElementById('form-cliente').classList.remove('oculto');
  }

  function editarCliente(clienteId) {
    const item = clientesCache.find((c) => c.id === clienteId);
    if (!item) return;
    const c = item.data;

    clienteEnEdicion = clienteId;
    cerrarModalCliente();

    document.getElementById('titulo-form-cliente').textContent = 'Editar cliente';
    document.getElementById('fc-nombre').value = c.nombre || '';
    document.getElementById('fc-empresa').value = c.empresa || '';
    document.getElementById('fc-direccion').value = c.direccion || '';
    document.getElementById('fc-barrio').value = c.barrio || '';
    document.getElementById('fc-ciudad').value = c.ciudad || '';
    document.getElementById('fc-telefono').value = c.telefono || '';
    document.getElementById('fc-celular').value = c.celular || '';
    document.getElementById('fc-correo').value = c.correo || '';
    document.getElementById('fc-fecha').value = c.fechaIngreso || '';
    document.getElementById('fc-equipos').value = c.equipos || '';
    document.getElementById('fc-observaciones').value = c.observaciones || '';

    document.getElementById('form-cliente').classList.remove('oculto');
    document.getElementById('form-cliente').scrollIntoView({ behavior: 'smooth' });
  }

  function ocultarFormularioCliente() {
    clienteEnEdicion = null;
    document.getElementById('form-cliente').classList.add('oculto');
  }

  async function guardarCliente() {
    const mensaje = document.getElementById('mensaje-form');
    const nombre = document.getElementById('fc-nombre').value.trim();

    if (!nombre) {
      mensaje.textContent = "El nombre del cliente es obligatorio.";
      mensaje.style.color = '#dc2626';
      return;
    }

    mensaje.textContent = "Guardando...";
    mensaje.style.color = '#555';

    const datosCliente = {
      nombre: nombre,
      empresa: document.getElementById('fc-empresa').value.trim(),
      direccion: document.getElementById('fc-direccion').value.trim(),
      barrio: document.getElementById('fc-barrio').value.trim(),
      ciudad: document.getElementById('fc-ciudad').value.trim(),
      telefono: document.getElementById('fc-telefono').value.trim(),
      celular: document.getElementById('fc-celular').value.trim(),
      correo: document.getElementById('fc-correo').value.trim(),
      fechaIngreso: document.getElementById('fc-fecha').value,
      equipos: document.getElementById('fc-equipos').value.trim(),
      observaciones: document.getElementById('fc-observaciones').value.trim()
    };

    try {
      if (clienteEnEdicion) {
        // Estamos editando un cliente existente
        await db.collection('Clientes').doc(clienteEnEdicion).update(datosCliente);
      } else {
        // Estamos creando un cliente nuevo
        await db.collection('Clientes').add(datosCliente);
      }

      // Limpiar el formulario
      ['fc-nombre','fc-empresa','fc-direccion','fc-barrio','fc-ciudad','fc-telefono','fc-celular','fc-correo','fc-fecha','fc-equipos','fc-observaciones']
        .forEach(id => document.getElementById(id).value = '');

      mensaje.textContent = "";
      ocultarFormularioCliente();
      cargarClientes(); // refrescamos la lista para que aparezca el cambio
    } catch (error) {
      mensaje.textContent = "Error al guardar: " + error.message;
      mensaje.style.color = '#dc2626';
    }
  }

  // ===== FORMULARIO: NUEVO SERVICIO =====
  async function mostrarFormularioServicio() {
    document.getElementById('form-servicio').classList.remove('oculto');

    // Llenamos el selector de clientes
    const selectCliente = document.getElementById('fs-cliente');
    selectCliente.innerHTML = '<option value="">Cargando clientes...</option>';
    const clientesSnap = await db.collection('Clientes').get();
    selectCliente.innerHTML = '';
    clientesSnap.forEach((doc) => {
      const c = doc.data();
      selectCliente.innerHTML += `<option value="${doc.id}">${c.nombre}</option>`;
    });
    if (clientesSnap.empty) {

  async function guardarTecnico() {
    const mensaje = document.getElementById('mensaje-form-tecnico');
    const nombre = document.getElementById('ft-nombre').value.trim();
    const correo = document.getElementById('ft-correo').value.trim();
    const clave = document.getElementById('ft-clave').value;

    if (!nombre || !correo || !clave) {
      mensaje.textContent = "Completa nombre, correo y contraseña.";
      mensaje.style.color = '#dc2626';
      return;
    }
    if (clave.length < 6) {
      mensaje.textContent = "La contraseña debe tener al menos 6 caracteres.";
      mensaje.style.color = '#dc2626';
      return;
    }

    mensaje.textContent = "Creando técnico...";
    mensaje.style.color = '#555';

    try {
      // Creamos el acceso de login usando la conexión "secundaria",
      // así no se cierra tu sesión de administrador
      const resultado = await authSecundaria.createUserWithEmailAndPassword(correo, clave);
      const nuevoUid = resultado.user.uid;

      // Guardamos su ficha en Firestore (con el mismo UID que su login)
      await db.collection('usuarios').doc(nuevoUid).set({
        nombre: nombre,
        correo: correo,
        rol: 'tecnico',
        activo: true
      });

      // Cerramos la sesión de la conexión secundaria (no afecta tu sesión principal)
      await authSecundaria.signOut();

      document.getElementById('ft-nombre').value = '';
      document.getElementById('ft-correo').value = '';
      document.getElementById('ft-clave').value = '';
      mensaje.textContent = "";
      ocultarFormularioTecnico();
      cargarTecnicos();
    } catch (error) {
      let texto = "Error al crear el técnico.";
      if (error.code === 'auth/email-already-in-use') texto = "Ese correo ya está registrado.";
      if (error.code === 'auth/invalid-email') texto = "El correo no es válido.";
      mensaje.textContent = texto;
      mensaje.style.color = '#dc2626';
    }
  }

  async function abrirDetalleCliente(clienteId) {
    let c = null;

    // Primero buscamos en la caché (más rápido, para el panel de admin)
    const item = clientesCache.find((x) => x.id === clienteId);
    if (item) {
      c = item.data;
    } else {
      // Si no está en caché (por ejemplo, el técnico), lo buscamos directo en Firestore
      const doc = await db.collection('Clientes').doc(clienteId).get();
      if (!doc.exists) return;
      c = doc.data();
    }

    // Buscamos el historial de servicios de este cliente (todas sus visitas anteriores)
    const historialSnap = await db.collection('servicios').where('clienteId', '==', clienteId).get();
    const visitas = [];
    for (const doc of historialSnap.docs) {
      const s = doc.data();
      let nombreTecnico = '(sin técnico)';
      if (s.tecnicoId) {
        const tecnicoDoc = await db.collection('usuarios').doc(s.tecnicoId).get();
        if (tecnicoDoc.exists) nombreTecnico = tecnicoDoc.data().nombre;
      }
      visitas.push({ ...s, nombreTecnico });
    }
    // Ordenamos de la visita más reciente a la más antigua
    visitas.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));

    let htmlHistorial = '<p>Este cliente no tiene servicios registrados todavía.</p>';
    if (visitas.length > 0) {
      htmlHistorial = visitas.map((v) => `

    // Armamos el link de Google Maps a partir de la dirección escrita
    const direccionCompleta = [c.direccion, c.barrio, c.ciudad].filter(Boolean).join(', ');
    const linkMapa = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(direccionCompleta);

    // Los botones de Editar/Eliminar solo tienen sentido para el administrador
    const esAdmin = !document.getElementById('panel-admin').classList.contains('oculto');
    const botonesAdmin = esAdmin ? `

          <p><strong>Empresa:</strong> ${c.empresa || '-'}</p>
          <p><strong>Dirección:</strong> ${c.direccion || '-'}</p>
          <p><strong>Barrio:</strong> ${c.barrio || '-'}</p>
          <p><strong>Ciudad:</strong> ${c.ciudad || '-'}</p>
          <p><strong>Teléfono:</strong> ${c.telefono || '-'}</p>
          <p><strong>Celular:</strong> ${c.celular || '-'}</p>
          <p><strong>Correo:</strong> ${c.correo || '-'}</p>
          <p><strong>Fecha de ingreso:</strong> ${c.fechaIngreso || '-'}</p>
          <p><strong>Equipos:</strong> ${c.equipos || '-'}</p>
          <p><strong>Observaciones:</strong> ${c.observaciones || '-'}</p>
          <a href="${linkMapa}" target="_blank" rel="noopener">
            <button type="button" class="ancho" style="background: var(--verde); margin-top: 6px;">📍 Ver ubicación en Google Maps</button>
          </a>
          ${botonesAdmin}

          <h3 class="titulo-seccion" style="margin-top:20px;">Historial de visitas</h3>

  // ===== COMPRIMIR UNA FOTO ANTES DE GUARDARLA (para que ocupe poco espacio) =====
  function comprimirImagen(archivo) {
    return new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onload = (evento) => {
        const img = new Image();
        img.onload = () => {
          const anchoMaximo = 800;
          const escala = Math.min(1, anchoMaximo / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width * escala;
          canvas.height = img.height * escala;
          const contexto = canvas.getContext('2d');
          contexto.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.onerror = reject;
        img.src = evento.target.result;
      };
      lector.onerror = reject;
      lector.readAsDataURL(archivo);
    });
  }

  // Aplica el filtro de mes y/o texto sobre el historial del técnico
  function filtrarHistorialTecnico() {
    const mes = document.getElementById('th-mes').value; // formato AAAA-MM
    const texto = document.getElementById('th-buscador').value.toLowerCase();

    const filtrados = historialTecnicoCache.filter((item) => {
      const coincideMes = !mes || (item.data.fecha || '').startsWith(mes);
      const coincideTexto = !texto || item.nombreCliente.toLowerCase().includes(texto);
      return coincideMes && coincideTexto;
    });

    dibujarHistorialTecnico(filtrados);
